name: Write ideas and scripts
# Runs when the app sends a request, and every hour as a safety net.
# Uses only free GitHub Actions minutes (unlimited for public projects).
on:
  push:
    branches: [main]
    paths: ['jobs/**', 'requests/**', 'worker/**', '.github/workflows/writer.yml']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: writer, cancel-in-progress: false }
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Write scripts for new video requests
        run: python worker/make_scripts.py
      - name: Refresh topic ideas if needed
        run: python worker/make_ideas.py --if-needed || echo "Ideas will be retried next hour."
      - name: Save results to the project
        run: |
          git config user.name "story-studio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in jobs scripts ideas; do [ -e "$d" ] && git add "$d"; done
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Cloud worker: scripts and ideas"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
