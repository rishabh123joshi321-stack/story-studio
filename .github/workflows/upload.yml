name: Upload to YouTube
# Uploads videos you approved in the app (always as Private). Runs right after
# an approval, and every hour as a safety net.
on:
  push:
    branches: [main]
    paths: ['jobs/**', 'worker/upload.py', '.github/workflows/upload.yml']
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: upload, cancel-in-progress: false }
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Anything approved?
        id: check
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json
          def want(j):
              return j.get("status") in ("approved", "uploading") or (j.get("status") == "posted" and j.get("youtube_id") and not j.get("extras_done") and j.get("extras_tries", 0) < 3)
          print("go=yes" if any(want(json.load(open(f))) for f in glob.glob("jobs/*.json")) else "go=no")
          PY
      - uses: actions/setup-python@v5
        if: steps.check.outputs.go == 'yes'
        with: { python-version: '3.12' }
      - name: Upload
        if: steps.check.outputs.go == 'yes'
        run: |
          git config user.name "story-studio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python worker/upload.py
