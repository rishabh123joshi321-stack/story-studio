name: Upload to YouTube
# Uploads videos you approved in the app (always as Private). Runs right after
# an approval, and every hour as a safety net.
on:
  push:
    branches: [main]
    paths: ['jobs/**', 'worker/upload.py', '.github/workflows/upload.yml']
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: upload, cancel-in-progress: false }
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Anything approved?
        id: check
        run: |
          if grep -l -E '"status": "(approved|uploading)"' jobs/*.json >/dev/null 2>&1; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "Nothing approved."; fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.go == 'yes'
        with: { python-version: '3.12' }
      - name: Upload
        if: steps.check.outputs.go == 'yes'
        run: |
          git config user.name "story-studio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python worker/upload.py
