name: Make videos
# Turns written scripts into finished videos. Started automatically after a
# script is written, and every hour as a safety net. Free for public projects.
on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Only this job id (optional)'
        required: false
  schedule:
    - cron: '47 * * * *'
permissions:
  contents: write
concurrency: { group: render, cancel-in-progress: false }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      ONLY_JOB: ${{ inputs.job }}
      SS_CACHE: ${{ github.workspace }}/../ss-cache
    steps:
      - uses: actions/checkout@v4
      - name: Anything to make?
        id: check
        run: |
          if grep -l '"status": "script_ready"' jobs/*.json >/dev/null 2>&1; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "Nothing waiting."; fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.go == 'yes'
        with: { python-version: '3.12', cache: 'pip', cache-dependency-path: worker/requirements.txt }
      - uses: actions/cache@v4
        if: steps.check.outputs.go == 'yes'
        with:
          path: ${{ github.workspace }}/../ss-cache
          key: ss-models-v1
      - name: Install tools
        if: steps.check.outputs.go == 'yes'
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q -r worker/requirements.txt
      - name: Make videos
        if: steps.check.outputs.go == 'yes'
        run: |
          git config user.name "story-studio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python worker/render_video.py
