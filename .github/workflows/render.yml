name: Make videos
# Turns written scripts into finished videos. Started automatically after a
# script is written, and every hour as a safety net. Free for public projects.
on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Only this job id (optional)'
        required: false
  schedule:
    - cron: '47 * * * *'
permissions:
  contents: write
jobs:
  render:
    # Shorts and long videos are made side by side, so a 40-minute video never holds up the Shorts.
    strategy:
      fail-fast: false
      matrix:
        kind: [short, long]
    concurrency: { group: 'render-${{ matrix.kind }}', cancel-in-progress: false }
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      RENDER_FORMAT: ${{ matrix.kind }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      ONLY_JOB: ${{ inputs.job }}
      SS_CACHE: ${{ github.workspace }}/../ss-cache
    steps:
      - uses: actions/checkout@v4
      - name: Anything to make?
        id: check
        run: |
          if grep -l -E '"status": "(script_ready|rendering|video_ready)"' $(grep -l '"format": "${{ matrix.kind }}"' jobs/*.json 2>/dev/null) /dev/null >/dev/null 2>&1; then echo "go=yes" >> "$GITHUB_OUTPUT"; elif [ "${{ matrix.kind }}" = "long" ] && grep -l '"extra_clip_wanted": true' jobs/*.json >/dev/null 2>&1; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "Nothing waiting."; fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.go == 'yes'
        with: { python-version: '3.12', cache: 'pip', cache-dependency-path: worker/requirements.txt }
      - uses: actions/cache@v4
        if: steps.check.outputs.go == 'yes'
        with:
          path: ${{ github.workspace }}/../ss-cache
          key: ss-models-v1
      - name: Install tools
        if: steps.check.outputs.go == 'yes'
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q -r worker/requirements.txt
      - name: Repair video file names
        if: steps.check.outputs.go == 'yes'
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q '.[] | select(([.assets[].name] | index("video.mp4")) == null) | .assets[] | select(.name == "video_wrapped.mp4") | .id'); do
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$id" -f name=video.mp4 -q .name || true
          done
      - name: Make videos
        if: steps.check.outputs.go == 'yes'
        run: |
          git config user.name "story-studio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python worker/render_video.py
      - name: Make titles, descriptions and thumbnails
        if: steps.check.outputs.go == 'yes'
        run: python worker/package.py
      - name: Cut a Short from each long video
        if: steps.check.outputs.go == 'yes' && matrix.kind == 'long'
        run: python worker/clips.py
      - name: Titles for the new Shorts
        if: steps.check.outputs.go == 'yes' && matrix.kind == 'long'
        env: { RENDER_FORMAT: '', CLIPS_ONLY: '1' }
        run: python worker/package.py
      - name: Subtitles in other languages
        if: steps.check.outputs.go == 'yes'
        run: python worker/translate.py
